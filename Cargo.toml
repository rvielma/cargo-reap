[package]
name = "cargo-reap"
version = "0.1.0"
edition = "2021"
description = "Recolector de basura para directorios target/ de Cargo"
license = "Apache-2.0"
repository = "https://github.com/rvielma/cargo-reap"
readme = "README.md"
keywords = ["cargo", "target", "gc", "disk", "cleanup"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
